# ──────────────────────────────────────────────────────────────────────────────
# keep-alive.yml — Render 콜드스타트 방지 헬스체크 워크플로우
#
# Render 무료 티어는 15분 이상 요청이 없으면 서버를 절전(sleep) 상태로 전환합니다.
# 절전 후 첫 요청은 40~60초가 걸려 사용자 경험이 크게 나빠집니다.
# 이 워크플로우는 10분마다 /health 엔드포인트에 GET 요청을 보내
# 서버가 항상 깨어 있도록 유지합니다.
#
# ⚠️ 2026-07-29 실측 교훈 — "깨워두기"에는 대가가 있다
#   Render 무료 플랜은 워크스페이스당 **월 750 인스턴스 시간**만 무료다.
#   (인스턴스 시간 = 서버가 '깨어서 돌아간' 시간. 자는 동안은 차감 안 됨)
#   24시간 내내 핑을 때리면 한 달 = 24h × 30~31일 ≒ 720~744시간이라
#   750시간 한도를 거의 다 태우고, 한도를 넘기면 Render가 **다음 달 1일까지
#   모든 무료 서비스를 정지(suspend)** 시킨다. 실제로 이 워크플로우 때문에
#   2026-07-29 백엔드가 503 `x-render-routing: suspend` 로 완전 정지됐다.
#   → 그래서 핑 시간대를 **한국시간 08:00 ~ 01:00 (하루 17시간)** 으로 제한한다.
#     17h × 31일 ≒ 527시간 → 750시간 한도 안에서 여유 확보(재배포·다른 서비스 몫 포함).
#     새벽 01~08시 접속자는 콜드스타트(약 1분)를 겪지만, 서버가 통째로
#     정지돼 하루 종일 먹통이 되는 것보다 훨씬 낫다.
# ──────────────────────────────────────────────────────────────────────────────

name: 🏥 Keep Render Alive

on:
  schedule:
    # 10분마다 실행 — GitHub 스케줄러는 수 분 지연이 흔해서(피크 시 10분+)
    # 14분 주기로는 지연 시 Render 15분 절전 기준을 넘겨 콜드스타트가 발생했다.
    # 크론 표현식: 분 시 일 월 요일  (시각은 UTC 기준 — 한국시간 = UTC + 9시간)
    #   UTC 23시       = 한국 08시  (아침 시작)
    #   UTC 0~15시     = 한국 09~24시 (밤 자정까지)
    #   → 결과: 한국시간 08:00~01:00 사이에만 10분마다 핑
    - cron: '*/10 23,0-15 * * *'

  # 수동으로도 실행 가능하도록 워크플로우 디스패치 허용
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    # GitHub Actions 제공 Ubuntu 최신 LTS 러너에서 실행
    runs-on: ubuntu-latest

    steps:
      # ── 1단계: 헬스체크 요청 ────────────────────────────────────────────────
      - name: 🩺 /health 엔드포인트 호출
        run: |
          echo "🕐 현재 시각 (UTC): $(date -u)"
          echo "📡 Render 백엔드 워밍업 요청 중..."

          # curl 옵션 설명:
          #   --fail   : HTTP 4xx/5xx 응답 시 종료 코드 비영으로 실패 처리
          #   --silent : 진행률 바 숨김 (로그 가독성)
          #   --max-time 30 : 30초 이내 응답 없으면 타임아웃
          #   --retry 2 : 실패 시 최대 2회 재시도
          #   --retry-delay 5 : 재시도 간격 5초
          HTTP_STATUS=$(curl \
            --silent \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --write-out "%{http_code}" \
            --output /dev/null \
            "https://coupang-severance-app.onrender.com/health")
          # ⚠️ 호스트명 주의: 실제 백엔드는 coupang-severance-"app".onrender.com
          #   과거 "-api" 오타로 존재하지 않는 서버(404 no-server)를 핑해
          #   콜드스타트 방지가 전혀 동작하지 않았다(2026-07-04 전수조사에서 적발).

          echo "📊 HTTP 응답 코드: $HTTP_STATUS"

          # 200 응답이면 성공, 아니면 경고만 출력 (워크플로우 실패 처리 안 함)
          # Render가 일시적으로 응답 못해도 워크플로우 자체가 실패로 표시되면 안 됨
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ 서버 정상 응답 — 콜드스타트 방지 성공"
          elif [ "$HTTP_STATUS" = "503" ]; then
            # 503 = Render가 서비스를 정지(suspend)시킨 상태.
            # 핑을 아무리 보내도 깨어나지 않는다(잠든 게 아니라 꺼진 것).
            # 원인 1순위: 월 750 무료 인스턴스 시간 소진 → 다음 달 1일 자동 복구
            # 원인 2순위: 결제 실패 / 대시보드에서 수동 정지
            echo "⛔ 503 SUSPENDED — 서버가 '절전'이 아니라 '정지' 상태입니다."
            echo "   Render 대시보드 → 해당 서비스 → Events 에서 정지 사유 확인 필요."
            echo "   무료 시간 소진이면 다음 달 1일 자동 복구 또는 유료 인스턴스로 즉시 복구."
            exit 0
          else
            echo "⚠️ 비정상 응답 코드 ($HTTP_STATUS) — 서버 상태 확인 필요"
            # exit 0으로 워크플로우 자체는 성공으로 처리 (알림 스팸 방지)
            exit 0
          fi
